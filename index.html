<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimGames — Игры для уроков</title>
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e0f2fe;
            background-image: radial-gradient(#3b82f6 0.8px, transparent 0.8px);
            background-size: 16px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 120px 16px;
            width: 100%;
        }

        .page { display: none; }
        .page.active { display: block; }

        .game-card {
            background: white;
            border: 4px solid #000;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0px #000;
            text-align: center;
        }

        .game-title {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #000;
        }

        .btn-download {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #000;
            font-weight: bold;
        }

        .contacts-card {
            background: #e2e8f0;
            border: 4px solid #000;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 6px 6px 0px #000;
        }

        .contacts-title { font-size: 26px; font-weight: 900; margin-bottom: 15px; }
        .contact-item { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #1e293b; }

        .btn-back {
            display: inline-block;
            background: #000;
            color: white;
            font-size: 20px;
            font-weight: 900;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            border: none;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-top: 2px solid #000;
            z-index: 1000;
        }

        .lang-btn {
            background: #ec4899;
            color: white;
            border: 3px solid #000;
            border-radius: 12px;
            padding: 10px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }

        .pencil-btn {
            flex: 1;
            max-width: 90px;
            height: 70px;
            border: 3px solid #000;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #000;
            cursor: pointer;
            box-shadow: 3px 0px 0px #000;
            text-align: center;
        }

        .pencil-green { background: #4ade80; }
        .pencil-red { background: #ef4444; }
        .pencil-yellow { background: #facc15; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ГЛАВНАЯ СТРАНИЦА -->
        <div id="page-main" class="page active">
            <div class="game-card">
                <div class="game-title" data-ru="Викторина" data-kg="Викторина">Викторина</div>
                <a href="Викторина.pptx" download class="btn-download" data-ru="Скачать" data-kg="Көчүрүү">Скачать</a>
            </div>

            <div class="game-card">
                    <div class="game-title" data-ru="Поле чудес" data-kg="Поле чудес">Поле чудес</div>
                <a href="Поле чудес.pptx" download class="btn-download" data-ru="Скачать" data-kg="Көчүрүү">Скачать</a>
            </div>

            <div class="game-card">
                <div class="game-title" data-ru="Своя игра" data-kg="Өз оюнум">Своя игра</div>
                <a href="своя игра.pptm" download class="btn-download" data-ru="Скачать" data-kg="Көчүрүү">Скачать</a>
            </div>
        </div>

        <!-- СТРАНИЦА КОНТАКТЫ -->
        <div id="page-contacts" class="page">
            <button class="btn-back" onclick="showPage('main')" data-ru="Назад" data-kg="Артка">Назад</button>
            
            <div class="contacts-card">
                <div class="contacts-title" data-ru="Контакты" data-kg="Байланыштар">Контакты</div>
                <div class="contact-item">Байматова Альбина</div>
                <div class="contact-item" style="font-weight: normal; font-size: 15px;" data-ru="Основатель" data-kg="Негиздөөчү">Основатель</div>
                <div class="contact-item">📞 +996 500 916 773</div>
                <div class="contact-item">✉️ albinabaimatova2009@gmail.com</div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КАРАНДАШАМИ -->
    <div class="bottom-bar">
        <button class="lang-btn" onclick="toggleLanguage()">RU | KG</button>
        
        <div class="pencil-btn pencil-green" onclick="showPage('main')" data-ru="Главная" data-kg="Башкы">Главная</div>
        <div class="pencil-btn pencil-red" onclick="showPage('main')" data-ru="Игры" data-kg="Оюндар">Игры</div>
        <div class="pencil-btn pencil-yellow" onclick="showPage('contacts')" data-ru="Контакты" data-kg="Байланыш">Контакты</div>
    </div>

    <script>
        let currentLang = 'ru';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'kg' : 'ru';
            
            document.querySelectorAll('[data-ru]').forEach(el => {
                el.innerText = el.getAttribute('data-' + currentLang);
            });
        }
    </script>
</body>
</html>
